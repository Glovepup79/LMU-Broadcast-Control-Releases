name: Cleanup old releases

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Keep current and previous release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }
            );

            // Sort newest to oldest using the release creation date
            releases.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );

            console.log(`Found ${releases.length} releases`);

            // Keep the newest two releases
            const keep = releases.slice(0, 2);
            const remove = releases.slice(2);

            console.log('Keeping:');
            for (const release of keep) {
              console.log(
                `- ${release.tag_name} (${release.created_at})`
              );
            }

            console.log(`Deleting ${remove.length} older release(s)`);

            for (const release of remove) {
              console.log(
                `Deleting ${release.tag_name} (created ${release.created_at})`
              );

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });

                console.log(`Deleted tag ${release.tag_name}`);
              } catch (e) {
                console.log(
                  `Tag ${release.tag_name} already deleted or not found`
                );
              }
            }
